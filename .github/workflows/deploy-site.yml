# Publishes the site to GitHub Pages. Runs when someone pushes to the default branch, and straight after
# a league submission, because commits made by a workflow's own token do not trigger other workflows.
# Needs Settings -> Pages -> Source set to "GitHub Actions".
name: Deploy site

on:
  push:
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Collect the public files
        run: |
          mkdir _site
          cp -r index.html .nojekyll assets css data js _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
